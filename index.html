<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeJS - Your Functional Cooking Companion</title>
    <!-- Link your CSS file here -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Header section -->
    <header>
        <h1>🍳 RecipeJS</h1>
        <p>Your Functional Cooking Companion</p>
    </header>
    
    <!-- Main section -->
    <main>
        <section class="controls">
            <div class="filters">
                <button data-filter="all" class="filter-btn active">All Recipes</button>
                <button data-filter="easy" class="filter-btn">Easy Recipes</button>
                <button data-filter="medium" class="filter-btn">Medium Recipes</button>
                <button data-filter="hard" class="filter-btn">Hard Recipes</button>
                <button data-filter="quick" class="filter-btn">Quick Recipes (Under 30 minutes)</button>
            </div>
            <div class="controls-right">
                <div class="search-wrap">
                    <input id="search-input" type="search" placeholder="Search by title or ingredient..." />
                    <button id="favorites-only" class="filter-btn">Show Favorites</button>
                </div>

                <div class="sorts">
                    <button data-sort="name" class="sort-btn">Name (A–Z)</button>
                    <button data-sort="time" class="sort-btn">Time (Fastest First)</button>
                </div>
            </div>
            <div id="recipe-counter" aria-live="polite" style="margin-top:0.75rem;text-align:center">Showing 0 of 0 recipes</div>
        </section>
        <div id="recipe-container">
            <!-- Recipe cards will be rendered here by JavaScript -->
        </div>
    </main>
    
    <!-- Link your JavaScript file here -->
    <script src="app.js"></script>
</body>
</html>
